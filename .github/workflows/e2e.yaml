# The plugin proven against a released runtime, on every push and pull
# request: `make e2e` runs it, in synthetic mode, on the plugin harness the
# Makefile pins beside its runtime image, beside the e2e's reader, and checks
# what the lake kept (e2e/run.py says each step). No secret: the runtime and
# harness images pull without a token, and sample data answers from Databento-
# shaped responses committed with the plugin, every value invented, so no
# Databento API key is needed or used.
#
# The plugin's image is built on the base image of the SDK it pins, pulled
# from ghcr.io. Locally the Makefile builds it from the sibling
# meridian-python checkout when that carries the pinned version.
#
# The job is named for the make target that runs it locally: `make e2e`, part
# of ci-local and so of the pre-push hook. It is its own workflow rather than
# a step of ci.yaml, which runs ci-remote without pulling images.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: make e2e
        run: make e2e
      # What the harness's components and runner printed, kept when it fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: .e2e/*.log
          if-no-files-found: ignore
          # .e2e/ is a hidden directory, which upload-artifact v4 leaves out
          # unless told.
          include-hidden-files: true
