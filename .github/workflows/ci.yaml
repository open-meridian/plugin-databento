# CI is confirmation, not the first place a failure is found. The pre-push hook
# runs `make ci-local` locally, so a red run here means the hook was bypassed
# or the runner differs from a developer's machine -- both worth knowing.
#
# The job is named for the make target it runs. It runs ci-remote rather than
# ci-local: check.yaml takes `make check`'s steps and e2e.yaml `make e2e`'s
# (which builds the plugin's image), so the difference is `make image`'s
# checks of that image. Building it pulls the SDK's base image and is what
# `meridian plugin upload` does, which is checked by ci-local before every
# push.
#
# The tests' container installs the SDK the plugin pins from PyPI on a
# runner. Locally the Makefile installs it from the sibling meridian-python
# checkout when that carries the pinned version.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make ci-remote
        run: make ci-remote
